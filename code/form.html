<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>DeadlineIn - Tambah / Edit Tugas</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

  <header>
    <h1>DeadlineIn</h1>
    <nav>
      <a href="home.html">Beranda</a> |
      <a href="form.html">Tambah Tugas</a>
    </nav>
  </header>

  <main>
    <h2>Tambah / Edit Tugas</h2>

    <form action="home.html" method="post">

      <fieldset>
        <legend>Informasi Dasar</legend>

        <p>
          <label for="nama-tugas">Nama Tugas</label><br>
          <input type="text" id="nama-tugas" name="nama-tugas" placeholder="Contoh: Laporan Praktikum Basis Data" required>
        </p>

        <p>
          <label for="mata-kuliah">Mata Kuliah</label><br>
          <select id="mata-kuliah" name="mata-kuliah" required>
            <option value="">-- Pilih Mata Kuliah --</option>
            <option value="basis-data">Basis Data</option>
            <option value="perancangan-dan-pemrograman-web">Perancangan dan Pemrograman Web</option>
            <option value="manajemen-bisnis">Manajemen Bisnis</option>
            <option value="struktur-data">Struktur Data</option>
            <option value="pengalaman-pengguna">Lainnya</option>
          </select>
        </p>

        <p>
          <label for="dosen">Dosen Pengampu</label><br>
          <input type="text" id="dosen" name="dosen" placeholder="Kode dosen">
        </p>
      </fieldset>

      <fieldset>
        <legend>Jadwal & Prioritas</legend>

        <p>
          <label for="tanggal-deadline">Tanggal Deadline</label><br>
          <input type="date" id="tanggal-deadline" name="tanggal-deadline" required>
        </p>

        <p>
          <label for="waktu-deadline">Waktu Deadline</label><br>
          <input type="time" id="waktu-deadline" name="waktu-deadline">
        </p>

        <p>
          <label for="status">Status Pengerjaan</label><br>
          <select id="status" name="status">
            <option value="belum">Belum dikerjakan</option>
            <option value="proses">Sedang dikerjakan</option>
            <option value="selesai">Selesai</option>
          </select>
        </p>
      </fieldset>

      <fieldset>
        <legend>Detail Tambahan</legend>

        <p>
          <label for="deskripsi">Instruksi / Detail Tugas</label><br>
          <textarea id="deskripsi" name="deskripsi" rows="5" cols="40" placeholder="Tuliskan detail instruksi tugas di sini..."></textarea>
        </p>

        <p>
          <label for="lampiran">Lampiran Tugas (opsional)</label><br>
          <input type="file" id="lampiran" name="lampiran" accept=".pdf,application/pdf">
        </p>
      </fieldset>

      <p>
        <button type="submit">Simpan Tugas</button>
        <button type="reset">Reset</button>
      </p>

    </form>

    <p><a class="tautan-panah" href="home.html">&larr; Kembali ke Beranda</a></p>
  </main>

</body>
</html>
