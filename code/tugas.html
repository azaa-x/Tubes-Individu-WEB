<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeadlineIn - Tabel Tugas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-halaman="tugas">
  <div id="notifikasi" class="alert notifikasi-toast" role="status" style="display:none"></div>

  <nav class="navbar navbar-expand-md navbar-deadlinein bg-white sticky-top">
    <div class="container">
      <a class="navbar-brand" href="home.html">DeadlineIn</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuUtama" aria-controls="menuUtama" aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuUtama">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="home.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link active" href="tugas.html">Daftar Tugas</a></li>
          <li class="nav-item"><a class="nav-link" href="form.html">Tambah Tugas</a></li>
          <li class="nav-item"><a class="nav-link" href="matkul.html">Mata Kuliah</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-md-5">
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
      <h2 class="judul-halaman mb-0">Daftar Tugas</h2>
      <a class="btn btn-brand" href="form.html">+ Tambah Tugas</a>
    </div>

    <div class="card shadow-sm border-0 mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-5">
            <label for="cari-tugas" class="form-label mb-1">Cari tugas</label>
            <input type="search" class="form-control" id="cari-tugas" placeholder="Ketik nama tugas atau mata kuliah...">
          </div>
          <div class="col-6 col-md-3">
            <label for="filter-status" class="form-label mb-1">Status</label>
            <select class="form-select" id="filter-status">
              <option value="semua">Semua status</option>
              <option value="belum">Belum dikerjakan</option>
              <option value="proses">Sedang dikerjakan</option>
              <option value="selesai">Selesai</option>
            </select>
          </div>
          <div class="col-6 col-md-4">
            <label for="urutan-tugas" class="form-label mb-1">Urutkan</label>
            <select class="form-select" id="urutan-tugas">
              <option value="deadline-asc">Deadline terdekat</option>
              <option value="deadline-desc">Deadline terjauh</option>
              <option value="nama">Nama (A-Z)</option>
            </select>
          </div>
        </div>
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mt-3">
          <small id="info-jumlah" class="text-secondary"></small>
          <button type="button" id="btn-reset-data" class="btn btn-sm btn-outline-secondary">Reset data dummy</button>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0">
      <div class="table-responsive">
        <table class="table table-tugas table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th scope="col">#</th>
              <th scope="col">Nama Tugas</th>
              <th scope="col">Mata Kuliah</th>
              <th scope="col">Deadline</th>
              <th scope="col">Status</th>
              <th scope="col" class="text-end">Aksi</th>
            </tr>
          </thead>
          <tbody id="tbody-tugas"></tbody>
        </table>
      </div>
      <div id="kosong-tugas" class="text-center text-secondary py-4" style="display:none">
        Tidak ada tugas yang cocok dengan pencarian atau filter.
      </div>
    </div>

    <p class="mt-4 mb-0"><a class="tautan-panah" href="home.html">&larr; Kembali ke Beranda</a></p>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
